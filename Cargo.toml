[workspace]
resolver = "2"
members = [
    "crates/almanac-bridge",
    "crates/almanac-server",
    "crates/almanac-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Almanac Contributors"]
repository = "https://github.com/brandon-gilchrist/almanac"
homepage = "https://github.com/brandon-gilchrist/almanac"
description = "A calendar for agents and their artifacts — iCalendar feeds with artifact-lineage checkmarks."
readme = "README.md"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors & logging
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# HTTP
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# iCalendar + recurrence
icalendar = "0.17"
rrule = "0.13"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Hashing / ids
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

# CLI deps for the binary crate
almanac-bridge = { path = "crates/almanac-bridge", version = "0.1.0" }
almanac-server = { path = "crates/almanac-server", version = "0.1.0" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
