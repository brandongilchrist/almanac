[package]
name = "almanac-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MCP server making Almanac agent-native — agents drive schedules, contracts, and lineage as first-class citizens."

[[bin]]
name = "almanac-mcp"
path = "src/main.rs"

[dependencies]
almanac-bridge = { workspace = true }
almanac-server = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = "1"
rmcp = { version = "3.0.0-beta.2", features = ["server", "macros", "transport-io"] }
schemars = "1"
chrono = { workspace = true }
